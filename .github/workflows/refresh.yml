name: Refresh DOD jobs

# Runs in GitHub's cloud (independent of any PC): scrape every source, rebuild
# web/public/jobs.json, commit it (keeps the schedule alive + versions the data),
# and redeploy the live Vercel site via a token.
on:
  schedule:
    # 19:00 IST (13:30 UTC). NOTE: GitHub's scheduled runs are best-effort and
    # often start 15-90 min late (especially on the hour), so the refresh lands
    # ~7-8 PM IST, not exactly 7:00. Trigger manually anytime from the Actions tab.
    - cron: "30 13 * * *"
  workflow_dispatch: {}       # manual / test runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Scrape + classify all sources
        run: python poll.py --seed

      - name: Export feed (web/public/jobs.json)
        run: python export.py

      - name: Commit refreshed feed
        run: |
          git config user.name "dod-bot"
          git config user.email "dod-bot@users.noreply.github.com"
          git add web/public/jobs.json web/public/stats-history.json
          git commit -m "chore: daily job-feed refresh" || echo "no changes to commit"
          git push || echo "nothing to push"

      - name: Deploy to Vercel (production)
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --token="$VERCEL_TOKEN"

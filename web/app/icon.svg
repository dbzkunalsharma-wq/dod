<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DOD">
  <defs>
    <linearGradient id="dod-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d0f1a"/>
      <stop offset="1" stop-color="#05060c"/>
    </linearGradient>
    <linearGradient id="dod-fg" x1="8" y1="22" x2="56" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- rounded tile + silver hairline (echoes the glass theme) -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#dod-bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#d6dbe9" stroke-opacity="0.28"/>
  <!-- faint top sheen -->
  <rect x="2" y="2" width="60" height="30" rx="14" fill="#ffffff" fill-opacity="0.04"/>

  <!-- DOD monogram: three geometric glyphs, gradient stroke -->
  <g stroke="url(#dod-fg)" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- left D -->
    <path d="M11 23 V41 H15.5 C20.5 41 23 37.2 23 32 C23 26.8 20.5 23 15.5 23 Z"/>
    <!-- center O -->
    <ellipse cx="32" cy="32" rx="6" ry="9"/>
    <!-- right D -->
    <path d="M41 23 V41 H45.5 C50.5 41 53 37.2 53 32 C53 26.8 50.5 23 45.5 23 Z"/>
  </g>
</svg>
